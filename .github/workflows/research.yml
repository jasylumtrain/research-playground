name: Midnight Research Sync

on:
  schedule:
    # Wakes up at 18:15, 19:15, and 20:15 UTC 
    # This is 02:15 AM, 03:15 AM, and 04:15 AM Singapore Time
    - cron: '15 18,19,20 * * *'
  workflow_dispatch:

jobs:
  research-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 

      - name: Research Logic
        run: |
          # 50% skip rate (mimics irregular late-night inspiration)
          if [ $((RANDOM % 100)) -lt 50 ]; then
            echo "No late night inspiration today. Sleeping."
            exit 0
          fi

          git config --global user.name "jasylumtrain"
          git config --global user.email "jasylumtrain@gmail.com"

          # Coding/Research focused messages
          MESSAGES=(
            "feat: add helper function for data parsing"
            "fix: optimize loop efficiency in main script"
            "docs: add comments to explain logic flow"
            "refactor: clean up variable naming"
            "chore: update python requirement versions"
          )
          
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          # Appending "code" to a Python file
          # This adds a comment with a random ID to keep it valid Python code
          echo "# Auto-generated research update: $(date)" >> analytics_lib.py
          echo "def sync_node_$RANDOM(): pass" >> analytics_lib.py

          git add analytics_lib.py
          git commit -m "$MSG"
          git push
